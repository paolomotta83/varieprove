<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browser a barra</title>
<style>
:root{
  --bg:#f4f1ea; --bar:#1f2933; --fg:#f4f1ea; --chip:#323f4b; --chip-on:#e0a63a; --chip-on-fg:#1f2933; --track:#3e4c59; --thumb:#9aa5b1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12161b; --bar:#0b0e12; --fg:#e8e4da; --chip:#232b34; --track:#232b34; --thumb:#52606d;}
}
:root[data-theme="dark"]{--bg:#12161b; --bar:#0b0e12; --fg:#e8e4da; --chip:#232b34; --track:#232b34; --thumb:#52606d;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}

/* barra alta: 8% dello schermo */
#bar{flex:0 0 8%;min-height:44px;background:var(--bar);color:var(--fg);display:flex;align-items:stretch;position:relative;z-index:5}
#list{flex:1;display:flex;align-items:center;gap:8px;padding:0 8vw;margin:0;list-style:none;
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;scrollbar-color:var(--thumb) var(--track);scroll-snap-type:x proximity}
#list::-webkit-scrollbar{height:5px}
#list::-webkit-scrollbar-track{background:var(--track)}
#list::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:3px}
#list a{cursor:pointer;display:block;padding:8px 16px;border-radius:999px;background:var(--chip);color:var(--fg);text-decoration:none;font-size:15px;scroll-snap-align:start}
#list a[aria-current="page"]{background:var(--chip-on);color:var(--chip-on-fg);font-weight:600}

/* area centrale: stesse proporzioni dello schermo, margini laterali 8% */
#stage{flex:1;position:relative;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:block}
#empty{position:absolute;left:0;right:0;top:50%;text-align:center;color:var(--bar);opacity:.55;font-size:15px;pointer-events:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #empty{color:var(--fg)}}
:root[data-theme="dark"] #empty{color:var(--fg)}

#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
#gate label{font-size:15px;color:var(--bar)}
#gate input{font-size:20px;letter-spacing:.3em;padding:12px 14px;border:1px solid var(--thumb);border-radius:10px;background:transparent;color:var(--bar);text-align:center}
#gate button{font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--bar);color:var(--fg);cursor:pointer}
#gate p{margin:0;min-height:1.2em;font-size:14px;color:#c0392b;text-align:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #gate label,:root:not([data-theme="light"]) #gate input{color:var(--fg)}:root:not([data-theme="light"]) #gate button{background:var(--chip-on);color:var(--chip-on-fg)}}
</style>
</head>
<body>
<div id="gate"><form id="gf" autocomplete="off"><label for="pw">Password</label><input id="pw" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus><button type="submit">Entra</button><p id="err" role="alert"></p></form></div>
<nav id="bar"><ul id="list"></ul></nav>
<main id="stage">
  <div id="empty">Scegli una voce dalla barra</div>
  <iframe id="view" title="Area browser" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>
</main>
<script>
var list=document.getElementById("list"),view=document.getElementById("view"),empty=document.getElementById("empty");
function pretty(n){var t=n.replace(/[-_]+/g," ");return t.charAt(0).toUpperCase()+t.slice(1)}
function addLink(l){
  var li=document.createElement("li"),a=document.createElement("a");
  a.textContent=l.t;a.setAttribute("role","button");a.tabIndex=0;
  a.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();a.click();}});
  a.addEventListener("click",function(e){
    e.preventDefault();
    list.querySelectorAll("a").forEach(function(x){x.removeAttribute("aria-current")});
    a.setAttribute("aria-current","page");
    empty.style.display="none";
    if(l.h){view.removeAttribute("src");view.srcdoc=l.h;}else{view.removeAttribute("srcdoc");view.src=l.u;}
  });
  li.appendChild(a);list.appendChild(li);
}
// Elenco generato in automatico: dalla più recente alla più vecchia
function render(apps){
  list.innerHTML="";
  apps.map(function(a){return{n:a.n,t:a.t||pretty(a.n),h:a.h,d:Date.parse(a.d)||0}})
    .sort(function(x,y){return y.d-x.d||x.t.localeCompare(y.t,"it")})
    .forEach(function(a){addLink({t:a.t,u:a.n+"/index.html",h:a.h})});
  if(!apps.length)msg("Nessuna app trovata");
}
function msg(t){list.innerHTML="";var li=document.createElement("li");li.textContent=t;li.style.cssText="padding:0 16px;opacity:.7;font-size:14px";list.appendChild(li)}

// 1) apps.json (creato da solo ad ogni caricamento, vedi .github/workflows)
function fromJson(){return fetch("apps.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})}
// 2) in alternativa, legge le cartelle direttamente da GitHub (repository pubblico)
function fromApi(){
  var h=location.hostname;if(!/\.github\.io$/.test(h))return Promise.reject();
  var user=h.split(".")[0],parts=location.pathname.split("/").filter(Boolean);
  var repo=(parts.length&&parts[0].indexOf(".")<0)?parts[0]:user+".github.io";
  var api="https://api.github.com/repos/"+user+"/"+repo+"/";
  try{var c=JSON.parse(localStorage.getItem("apps-cache"));if(c&&Date.now()-c.t<3600000)return Promise.resolve(c.a)}catch(e){}
  return fetch(api+"contents/").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(items){
    var dirs=items.filter(function(i){return i.type==="dir"&&!/^[._]/.test(i.name)});
    return Promise.all(dirs.map(function(i){
      var o={n:i.name,t:pretty(i.name),d:""};
      return fetch(api+"commits?per_page=1&path="+encodeURIComponent(i.name))
        .then(function(r){return r.ok?r.json():[]})
        .then(function(c){if(c[0])o.d=c[0].commit.committer.date;return o}).catch(function(){return o});
    })).then(function(a){
      if(a.every(function(o){return o.d})){try{localStorage.setItem("apps-cache",JSON.stringify({t:Date.now(),a:a}))}catch(e){}}
      return a});
  });
}
fromJson().catch(fromApi).then(render).catch(function(){msg("Elenco non disponibile")});

// Accesso: confronto con l’impronta SHA-256 (la password non compare nel codice)
var HASH="eb5910a9bb93391a8ef0820513568f868fe5f34525fa840e75196a964e372803";
async function sha(t){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function open_(){document.getElementById("gate").remove();try{sessionStorage.setItem("ok","1")}catch(e){}}
try{if(sessionStorage.getItem("ok")==="1")open_();}catch(e){}
document.getElementById("gf").addEventListener("submit",async function(e){
  e.preventDefault();var pw=document.getElementById("pw"),err=document.getElementById("err");
  try{if(await sha(pw.value)===HASH){open_();return;}}catch(x){err.textContent="Browser non supportato (serve https).";return;}
  err.textContent="Password errata";pw.value="";pw.focus();
});
</script>
</body>
</html>

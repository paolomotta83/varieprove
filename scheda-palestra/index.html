<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheda Palestra</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F7;--card:#fff;--ink:#14181F;--mute:#5F6773;--line:#DDE1E7;--acc:#1F4FFF;--acc-ink:#fff;--ok:#12805C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#181C24;--ink:#EEF0F4;--mute:#9AA3B0;--line:#2A303B;--acc:#6C8BFF;--acc-ink:#0B1020;--ok:#4CC9A0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--card:#181C24;--ink:#EEF0F4;--mute:#9AA3B0;--line:#2A303B;--acc:#6C8BFF;--acc-ink:#0B1020;--ok:#4CC9A0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 80px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
h1{font-size:34px;line-height:1.1}
h2{font-size:26px;margin:18px 0 2px}
h3{font-size:19px;margin:20px 0 8px;color:var(--acc)}
.sub{color:var(--mute);margin:2px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 15px Barlow,sans-serif;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
nav button:focus-visible,.ex input:focus-visible,.reset:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.badge{display:inline-block;background:var(--ok);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;margin-left:8px;vertical-align:middle}
.xl{padding-left:32px}
.xr{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.xr input{width:22px;height:22px;margin:0;flex:0 0 auto;accent-color:var(--acc)}
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.ex.done{opacity:.6}
.ex.done .nm{text-decoration:line-through}
.ex>input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--acc)}
.nm{font-weight:500}
.sr{color:var(--acc);font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600}
.note{color:var(--mute);font-size:14px;grid-column:2}
.ld{grid-column:2;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.ld select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit}
.w3{width:calc(3ch + 40px)}
.nt{grid-column:2;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px}
.nt::placeholder{color:var(--mute)}
.w12{width:calc(12ch + 40px)}
.ld input{width:110px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit}
.bt{grid-column:3;grid-row:1/span 3;align-self:start;display:flex;flex-direction:column;gap:6px}
.rb{display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:50%;color:#fff;text-decoration:none}
.rb svg{width:17px;height:17px}
.yt{background:#F2994A;color:#3B1D06}
.gg{background:var(--ok);color:var(--acc-ink)}
.ig{background:#E9604E}
.rb:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ex.done .rb{pointer-events:none;opacity:.35}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.acts .reset{margin-top:0}
.rec{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:999px;padding:10px 22px;font:500 16px Barlow,sans-serif;cursor:pointer}
.rec:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
pre.pv{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0 0;user-select:text}
ul.p{margin:6px 0 0;padding-left:20px}
ul.p li{margin:3px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
td,th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--mute)}
tr:last-child td{border-bottom:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px 12px}
.reset{margin-top:22px;border:1px solid var(--line);background:none;color:var(--mute);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.key{border-left:4px solid var(--acc);padding:4px 0 4px 12px;margin:18px 0}
</style>
</head>

function parseW(txt){var items=[],c2=null;txt.split(/\r?\n/).forEach(function(l){
 var m=/^- (.*?)( \[fatto\])?\s*$/.exec(l);
 if(m){c2={n:m[1].trim(),d:!!m[2],f:{}};items.push(c2);return}

function loadW(txt,fn){
 var m=/^pls_(\d+)_/i.exec(fn||""),d=m?dayById("g"+m[1]):(/^pls_N_/i.test(fn||"")?dayById("nd"):null);
 if(!d){var h=/SCHEDA PALESTRA\s*[–-]\s*(.+)/.exec(txt);if(h)d=DAYS.filter(function(x){return x.title.toUpperCase()===h[1].trim().toUpperCase()})[0]}
 if(!d)return null;
 var cards=[],cnt=0;
 d.warm.forEach(function(x,i){cards.push({k:Kw(d,i),n:x,ex:0})});
 d.groups.forEach(function(g,gi){g[1].forEach(function(e,ei){cards.push({k:K(d,gi,ei),n:e[0],ex:1})})});
 if(d.cardio)cards.push({k:d.id+"-c",n:d.cardio,ex:0});
 d.cool.forEach(function(x,i){cards.push({k:Kc(d,i),n:x,ex:0})});
 parseW(txt).forEach(function(it){
  var c=cards.filter(function(x){return !x.u&&x.n===it.n})[0];if(!c)return;c.u=1;
  var s=STATE[c.k]=STATE[c.k]||{},f=it.f,ch=0;

   var rp=f["ripetizioni"]||"",r=/^(\d+)x(\d*)$/.exec(rp);
   if(r){if(+r[1]>=1&&+r[1]<=25){s.p=String(+r[1]);ch=1}if(r[2]&&+r[2]>=1&&+r[2]<=100){s.n=String(+r[2]);ch=1}}
   else if(/^\d+$/.test(rp)&&+rp>=1&&+rp<=100){s.n=String(+rp);ch=1}
   var k2=/(\d+)\s*kg/.exec(f["carico"]||"");if(k2&&+k2[1]<=200){s.l=String(+k2[1]);ch=1}
   var q=["Pessimo","Migliorabile","Buono"].filter(function(z){return z.toLowerCase()===(f["qualità"]||"").toLowerCase()})[0];if(q){s.q=q;ch=1}
   var cs=f["consiglio"];if(cs&&cs.toLowerCase()!=="non inserito"){s.t=cs;ch=1}
  }else if(f["note"]){s.l=f["note"];ch=1}
  if(ch)cnt++});
 save();return{d:d,n:cnt}}
